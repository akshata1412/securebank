name: SecureBank CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r services/requirements.txt pytest flake8
    - name: Lint with flake8
      run: flake8 web/ services/ tests/ --count --max-line-length=120 --extend-ignore=E501,E722 --statistics
    - name: Run tests
      run: pytest -q tests/

  integration:
    name: Three-tier stack in docker compose
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Start db, 3 microservices, internal LB and web
      run: docker compose up -d --build --wait --wait-timeout 180 db && docker compose up -d --build
    - name: Sign in, transfer and read the passbook through the web tier
      run: |
        for i in $(seq 1 30); do curl -sf http://localhost:8080/health/deep && break; sleep 3; done
        curl -sf http://localhost:8080/health/deep
        curl -s -c j -b j -o /dev/null -d 'username=akshata&password=demo123' http://localhost:8080/
        curl -s -c j -b j -d 'recipient=rahul&amount=250&note=CI' http://localhost:8080/transfer | grep -q 'TXN'
        curl -s -c j -b j http://localhost:8080/history | grep -q 'CI'
    - name: The web tier cannot reach the database
      run: |
        ! docker compose exec -T web python -c "import socket; socket.create_connection(('db', 3306), 3)"
    - name: Logs on failure
      if: failure()
      run: docker compose logs --tail 80

  deliver:
    name: Publish images to GitHub Container Registry
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false      # one registry hiccup should not cancel the other images
      max-parallel: 2
      matrix:
        image: [web, users, accounts, passbook]
    steps:
    - uses: actions/checkout@v4
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push securebank-${{ matrix.image }}
      run: |
        IMG=ghcr.io/akshata1412/securebank-${{ matrix.image }}
        if [ "${{ matrix.image }}" = web ]; then
          docker build -f web/Dockerfile -t $IMG:${{ github.sha }} -t $IMG:latest .
        else
          docker build -f services/Dockerfile --build-arg SERVICE=${{ matrix.image }} -t $IMG:${{ github.sha }} -t $IMG:latest .
        fi
        for i in 1 2 3; do docker push $IMG:${{ github.sha }} && docker push $IMG:latest && exit 0; echo "push failed, retrying"; sleep 15; done; exit 1
