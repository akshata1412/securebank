# SecureBank app on Kubernetes (k3s). DB password lives in a Secret created with:
#   kubectl create secret generic securebank-db --from-literal=DB_PASSWORD=... --from-literal=SECRET_KEY=...
apiVersion: v1
kind: ConfigMap
metadata:
  name: securebank-config
data:
  DB_HOST: securebank-db.cdiauaewk6q6.ap-southeast-2.rds.amazonaws.com
  DB_USER: admin
  DB_NAME: securebank
  S3_BUCKET: securebank-backups-akshata-2026
  AWS_REGION: ap-southeast-2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securebank
  labels: {app: securebank}
spec:
  replicas: 3
  selector:
    matchLabels: {app: securebank}
  template:
    metadata:
      labels: {app: securebank}
    spec:
      containers:
      - name: securebank
        image: ghcr.io/akshata1412/securebank:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef: {name: securebank-config}
        - secretRef: {name: securebank-db}
        env:
        - name: SERVER_ID
          valueFrom:
            fieldRef: {fieldPath: metadata.name}
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {memory: 256Mi}
        readinessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: securebank-service
spec:
  type: NodePort
  selector: {app: securebank}
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
