name: SecureBank CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE: ghcr.io/akshata1412/securebank

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt pytest flake8

    - name: Lint with flake8
      run: flake8 app/ tests/ --count --max-line-length=120 --extend-ignore=E501,E722 --statistics

    - name: Run tests
      run: pytest -q tests/

    - name: Build Docker image
      run: docker build -t securebank:${{ github.sha }} .

  deliver:
    name: Publish image to GitHub Container Registry
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      run: |
        docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
        docker push $IMAGE:${{ github.sha }}
        docker push $IMAGE:latest
